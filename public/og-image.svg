<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Pozadie -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dekoratívne kruhy -->
  <circle cx="1050" cy="120" r="200" fill="#10b981" opacity="0.07"/>
  <circle cx="150" cy="520" r="160" fill="#0ea5e9" opacity="0.07"/>

  <!-- === Logo ikona (atom) === -->
  <rect x="72" y="56" width="96" height="96" rx="22" fill="url(#logoGrad)"/>
  <!-- Nucleus -->
  <circle cx="120" cy="104" r="8" fill="white"/>
  <!-- Orbitals -->
  <ellipse cx="120" cy="104" rx="38" ry="14" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  <ellipse cx="120" cy="104" rx="38" ry="14" fill="none" stroke="white" stroke-width="3" opacity="0.9" transform="rotate(60 120 104)"/>
  <ellipse cx="120" cy="104" rx="38" ry="14" fill="none" stroke="white" stroke-width="3" opacity="0.9" transform="rotate(-60 120 104)"/>

  <!-- Názov vedľa loga -->
  <text x="190" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">Náuka Portál</text>
  <text x="190" y="135" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">naukaportal.netlify.app</text>

  <!-- Hlavný text -->
  <text x="80" y="270" font-family="system-ui, sans-serif" font-size="66" font-weight="700" fill="white">Fyzika · Matematika</text>
  <text x="80" y="350" font-family="system-ui, sans-serif" font-size="66" font-weight="700" fill="white">Chémia</text>

  <!-- Podtitul -->
  <text x="80" y="425" font-family="system-ui, sans-serif" font-size="27" fill="#94a3b8">Bezplatné materiály pre gymnazistov na Slovensku</text>

  <!-- Kartičky predmetov -->
  <rect x="80" y="490" width="230" height="78" rx="16" fill="#0ea5e9" opacity="0.18"/>
  <rect x="80" y="490" width="230" height="78" rx="16" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <text x="195" y="536" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Fyzika</text>

  <rect x="330" y="490" width="230" height="78" rx="16" fill="#10b981" opacity="0.18"/>
  <rect x="330" y="490" width="230" height="78" rx="16" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="445" y="536" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#34d399" text-anchor="middle">📐 Matematika</text>

  <rect x="580" y="490" width="230" height="78" rx="16" fill="#f97316" opacity="0.18"/>
  <rect x="580" y="490" width="230" height="78" rx="16" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="695" y="536" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#fb923c" text-anchor="middle">🧪 Chémia</text>
</svg>
